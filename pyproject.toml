[project]
name = "mercaplan-api"
version = "0.1.0"
description = "API de MercaPlan: genera menús, recetas y lista de la compra con IA generativa"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "azure-identity>=1.19",
]

[tool.uv]
package = false
